description = "This application will expose a REST service using which NNP RAG will be consulted for creating a context"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.128.0",
    "langchain>=1.2.6",
    "langchain-community>=0.4.1",
    "langchain-huggingface>=1.2.0",
    "langchain-openai>=1.1.7",
    "openai>=2.15.0",
    "pymilvus>=2.6.6",
    "python-dotenv>=1.2.1",
    "sentence-transformers>=5.2.0",
    "uvicorn>=0.40.0",
    "requests>=2.32.0",
    "minio>=7.2.0",
]
